<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="This web page is about White Water Rafting in Chile. This web page will take you through our exciting tour guide by our professional team. You will not regret it. Come with us and have fun.">
    <meta name="author" content="Claudio A. Espinoza">
    <title>Contact Us - Chile White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="grid">
            <img src="images/logo.jpg" alt="Chile White Water Rafting Logo" />

            <nav class="navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>
    <main>
        <h1 class="title">White Water Rafting Company</h1>
        <section>
            <p>123 Main River Street</p>
            <p>Kolop, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>
        <section class="contact-section">
            <div class="contact-layout">
                <!-- Map -->
                <div class="map">
                    <iframe title="Chile White Water Rafting Location"
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d50647.4375909995!2d-72.6742452!3d-37.49695309999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2scl!4v1759949973370!5m2!1ses-419!2scl"
                        allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <!-- Form -->
                <div class="form-container">
                    <form>
                        <fieldset>
                            <div class="form-item column2">
                                <label for="fullname">Full Name:</label>
                                <input type="text" id="fullname" name="fullname" required />
                            </div>
                            <div class="form-item column2">
                                <label for="useremail">Email:</label>
                                <input type="email" id="useremail" name="useremail" required />
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Message Purpose</legend>
                            <div>
                                <input type="checkbox" id="generalInquiry" name="inquiry[]" value="General Inquiry" />
                                <label for="generalInquiry">General Inquiry</label>
                            </div>
                            <div>
                                <input type="checkbox" id="reservationQuestion" name="inquiry[]"
                                    value="Reservation Question" />
                                <label for="reservationQuestion">Reservation Question</label>
                            </div>
                            <div>
                                <input type="checkbox" id="websiteSuggestion" name="inquiry[]"
                                    value="Website Suggestion" />
                                <label for="websiteSuggestion">Website Suggestion</label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Message</legend>
                            <textarea id="feedback" name="feedback" rows="4" placeholder="Type here"></textarea>
                        </fieldset>

                        <div>
                            <input type="checkbox" id="subscribe" name="subscribe" />
                            <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                        </div>

                        <button type="submit">Get in touch!</button>
                    </form>
                </div>
            </div>
        </section>
        <section>
            <h4>We Are Here to Serve You</h4>
            <div class="profile">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile 1" />
                    <figcaption></figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile 2" />
                    <figcaption></figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile 3" />
                    <figcaption></figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2025 - Chile White Water Rafting - Claudio A. Espinoza</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.jpg" alt="Facebook Icon" />
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon" />
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.jpg" alt="Instagram Icon" />
            </a>
        </nav>
    </footer>
</body>

</html>
